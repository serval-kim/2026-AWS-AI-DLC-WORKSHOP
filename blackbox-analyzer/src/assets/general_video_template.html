<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>제너럴 영상 템플릿</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #050812;
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .template {
      width: 1080px;
      height: 1920px;
      position: relative;
      overflow: hidden;
      color: white;
      background:
        radial-gradient(circle at 50% 20%, rgba(20, 120, 255, .20), transparent 34%),
        radial-gradient(circle at 50% 100%, rgba(0, 180, 255, .18), transparent 35%),
        linear-gradient(180deg, #06091a 0%, #08122c 100%);
    }

    /* 복잡한 배경은 이미지처럼 보이게 CSS 패턴 처리 */
    .template::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .42;
      background-image:
        linear-gradient(135deg, transparent 0 46%, rgba(0, 180, 255, .45) 47% 48%, transparent 49%),
        linear-gradient(45deg, transparent 0 47%, rgba(44, 114, 255, .32) 48% 49%, transparent 50%);
      background-size: 180px 180px;
      mask-image: linear-gradient(to bottom, transparent, black 18%, black 88%, transparent);
    }

    .top-frame, .bottom-frame {
      position: absolute;
      left: 26px;
      right: 26px;
      height: 86px;
      border: 4px solid #147cff;
      box-shadow: 0 0 18px rgba(0, 194, 255, .75), inset 0 0 14px rgba(0, 194, 255, .35);
      clip-path: polygon(4% 0, 96% 0, 100% 50%, 96% 100%, 4% 100%, 0 50%);
      opacity: .95;
    }
    .top-frame { top: 24px; }
    .bottom-frame { bottom: 24px; }

    .title {
      position: absolute;
      top: 110px;
      width: 100%;
      text-align: center;
      font-weight: 1000;
      letter-spacing: -0.06em;
      line-height: .98;
      text-shadow: 0 6px 0 rgba(0,0,0,.35);
    }
    .title .yellow {
      display: block;
      color: #fff200;
      font-size: 116px;
      margin-bottom: 22px;
    }
    .title .red {
      display: block;
      color: #f31818;
      font-size: 122px;
    }

    .video {
      position: absolute;
      left: 48px;
      right: 48px;
      top: 410px;
      height: 860px;
      border: 5px solid #49d6ff;
      border-radius: 18px;
      background:
        linear-gradient(135deg, rgba(255,255,255,.08), transparent 26%),
        #111;
      box-shadow: 0 0 25px rgba(73, 214, 255, .85), inset 0 0 80px rgba(255,255,255,.03);
      display: grid;
      place-items: center;
      color: rgba(255,255,255,.22);
      font-size: 52px;
      font-weight: 900;
    }

    .subtitle-box {
      position: absolute;
      left: 48px;
      right: 300px;
      bottom: 250px;
      min-height: 245px;
      padding: 38px 44px;
      border: 4px solid #148bff;
      background: rgba(4, 12, 31, .78);
      box-shadow: 0 0 18px rgba(0, 140, 255, .55);
      clip-path: polygon(0 0, 82% 0, 88% 20%, 100% 20%, 100% 100%, 0 100%);
    }
    .subtitle-label {
      color: #00c8ff;
      font-weight: 900;
      font-size: 34px;
      margin-bottom: 24px;
    }
    .subtitle {
      font-size: 52px;
      line-height: 1.38;
      font-weight: 900;
      letter-spacing: -0.04em;
      word-break: keep-all;
    }

    /* 오른쪽 하단 인물 배경제거 이미지 자리 */
    .person {
      position: absolute;
      right: 28px;
      bottom: 155px;
      width: 330px;
      height: 520px;
      border-radius: 170px 170px 0 0;
      background:
        radial-gradient(circle at 50% 18%, #f1d7c8 0 18%, transparent 19%),
        linear-gradient(#111a2e 36%, #070a12 36%);
      filter: drop-shadow(0 0 18px rgba(0,0,0,.65));
    }
    .person::before {
      content: "한문철\\A 배경제거\\A 이미지";
      white-space: pre;
      position: absolute;
      inset: 40px 20px;
      display: grid;
      place-items: center;
      text-align: center;
      font-size: 30px;
      font-weight: 900;
      line-height: 1.25;
      color: rgba(255,255,255,.8);
    }

    .guide {
      position: absolute;
      inset: 0;
      pointer-events: none;
      border: 14px solid rgba(0,0,0,.18);
    }
  </style>
</head>
<body>
  <main class="template">
    <div class="top-frame"></div>

    <h1 class="title">
      <span class="yellow">타이틀 한 줄</span>
      <span class="red">타이틀 두 번째 줄</span>
    </h1>

    <section class="video">영상 영역</section>

    <section class="subtitle-box">
      <div class="subtitle-label">스크립트 자막 영역</div>
      <div class="subtitle">
        여기에 스크립트 자막이 들어갑니다<br />
        두 줄까지 표시되는 자막 영역입니다
      </div>
    </section>

    <aside class="person"></aside>

    <div class="bottom-frame"></div>
    <div class="guide"></div>
  </main>
</body>
</html>
