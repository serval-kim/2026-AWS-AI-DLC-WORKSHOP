[project]
name = "accident-analysis"
version = "0.1.0"
description = "블랙박스 영상 AI 사고 분석 및 과실비율 판단 시스템"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.hypothesis]
database_backend = "directory"
